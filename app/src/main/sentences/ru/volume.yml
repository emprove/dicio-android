up:
  - (сделай|сделать)? (погромче|громче)
  - (прибавь|увеличь|добавь|подними) (громкость|звук)?
  - (ещё|еще) громче

down:
  - (сделай|сделать)? (потише|тише)
  - (убавь|уменьши|убери|понизь|снизь) (громкость|звук)?
  - (ещё|еще) тише

max:
  - (максимальная|полная) громкость
  - (громкость|звук) на (максимум|полную)
  - (сделай|включи)? на ((всю катушку)|полную|максимум)

mute:
  - (выключи|отключи|убери) (звук|громкость)
  - без звука

unmute:
  - (включи|верни) (звук|громкость)

set_level:
  - (громкость|звук) (на)? .level.
  - (поставь|установи|сделай) (громкость|звук) (на)? .level.
